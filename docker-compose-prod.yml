networks:
  certitrack-network:
    driver: bridge

volumes:
  mongo-data:
  backend-data:
  backend-uploads:
  whatsapp-session:

services:
  mongodb:
    image: mongo:7
    container_name: certitrack-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=certitrack
    volumes:
      - mongo-data:/data/db
    networks:
      - certitrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: certitrack-backend
    restart: unless-stopped
    ports:
      # Bind to localhost only — Cloudflare Tunnel / nginx is the public entry point
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/certitrack?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - TZ=Asia/Jakarta
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - whatsapp-session:/app/auth_info_baileys
    networks:
      - certitrack-network

  frontend:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: certitrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - certitrack-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-certitrack
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - certitrack-network
