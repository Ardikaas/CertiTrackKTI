networks:
  certitrack-network:
    driver: bridge

volumes:
  mongo-data:
  whatsapp-session:

services:
  mongodb:
    image: mongo:7
    container_name: certitrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=certitrack
    volumes:
      - mongo-data:/data/db
    networks:
      - certitrack-network

  frontend:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: certitrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - certitrack-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: certitrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:admin123@mongodb:27017/certitrack?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Asia/Jakarta
    depends_on:
      - mongodb
    volumes:
      - whatsapp-session:/app/auth_info_baileys
    networks:
      - certitrack-network
